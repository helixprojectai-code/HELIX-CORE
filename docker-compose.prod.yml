version: '3.8'

services:
  watchtower:
    image: python:3.11-slim
    container_name: helix_watchtower
    restart: unless-stopped
    cap_drop: [ALL]
    user: 1000:1000
    networks:
      - helix-net
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./identity:/app/identity:ro
      - ./agents:/app/agents:ro
      - type: tmpfs
        target: /tmp
    working_dir: /app
    command: sh -c "pip install --no-cache-dir streamlit && streamlit run identity/dashboard.py"

networks:
  helix-net:
    driver: bridge
    internal: true
